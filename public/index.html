<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Disco y Destino 70's</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Screens injected by JS -->
  </div>

  <button type="button" id="btn-back" class="btn-back" hidden aria-label="Regresar">
    ← Atrás
  </button>

  <div id="modal-root" class="modal-root" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <h3 id="modal-title"></h3>
      <p id="modal-body"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="modal-cancel">Cancelar</button>
        <button type="button" class="btn btn-primary" id="modal-ok">Confirmar</button>
      </div>
    </div>
  </div>

  <div id="panel-root" class="panel-root" hidden>
    <div class="panel-backdrop"></div>
    <div class="panel-card">
      <header class="panel-header">
        <h3 id="panel-title"></h3>
        <button type="button" class="btn-icon" id="panel-close" aria-label="Cerrar">✕</button>
      </header>
      <div class="panel-body" id="panel-body"></div>
    </div>
  </div>

  <script src="/assets/js/gsap.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/animations/vinyl.js"></script>
  <script src="/js/animations/plinko.js"></script>
  <script src="/js/animations/slot.js"></script>
  <script src="/js/animations/celebration.js"></script>
  <script src="/js/screens/ui1.js"></script>
  <script src="/js/screens/ui2.js"></script>
  <script src="/js/screens/ui3.js"></script>
  <script src="/js/screens/ui4.js"></script>
  <script src="/js/screens/ui5.js"></script>
  <script src="/js/screens/ui6.js"></script>
  <script src="/js/screens/ui7.js"></script>
  <script src="/js/disco-ball.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
